<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page paint under the iPhone home indicator, and
     the bottom tab bar below pads itself back out with env(safe-area-inset-*).
     Without it a standalone launch leaves a white band under the bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}EV Smart Charge{% endblock %}</title>

<!-- Added to the home screen this launches without browser chrome, which is the
     whole of what "app feel" turned out to need: the layout was already
     responsive and dark-mode aware. -->
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<!-- iOS ignores the manifest and wants its own three. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EV Charge">
<!-- Two, so the status bar follows the page into dark mode rather than staying
     the light accent against a dark screen. -->
<meta name="theme-color" content="#2f6f4f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<style>
  /* Tokens are defined on :root and only redefined for dark, so no colour has
     its single definition inside a media query. */
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6b66;
    --line: #e2e2dd;
    --accent: #2f6f4f;
    --accent-soft: #cfe3d7;
    --warn: #9a4a2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1e2024;
      --ink: #e8e8e4;
      --muted: #9a9a94;
      --line: #2e3136;
      --accent: #6cc08c;
      --accent-soft: #2c4436;
      --warn: #e0906f;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); }

  header {
    display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: baseline;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: .02em; }
  header h1 a { color: var(--ink); text-decoration: none; }
  nav { display: flex; gap: 1.25rem; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover, nav a.on { color: var(--ink); }
  /* Desktop reads the labels; the icons are for the bottom bar below. */
  nav svg { display: none; }

  main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
  h2 { font-size: 1rem; margin: 2rem 0 .75rem; }
  h2:first-child { margin-top: 0; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .figures { display: flex; flex-wrap: wrap; gap: 2rem; }
  .figure .value { font-size: 1.6rem; font-variant-numeric: tabular-nums; }
  .figure .value.big { font-size: 2.2rem; color: var(--accent); }
  .figure .label { color: var(--muted); font-size: .82rem; }

  .note { color: var(--muted); font-size: .82rem; margin: .5rem 0 0; }
  .warn { color: var(--warn); }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: .45rem .6rem; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: .8rem; }
  td.num, th.num { text-align: right; }
  /* Wide tables scroll inside their own box rather than the page. */
  .scroll { overflow-x: auto; }

  .chart { width: 100%; height: auto; }
  .chart .bar { fill: var(--accent); }
  .chart .axis { stroke: var(--line); }
  .chart .tick { fill: var(--muted); font-size: 11px; }

  .strip { width: 300px; height: 44px; display: block; }
  .strip .slot { fill: var(--line); }
  .strip .slot.charged { fill: var(--accent); }

  /* A settings row: name on the left, value on the right, one line of hint
     under both. Every value here is short - 7, 11.0, 82, 80 - so they read
     better right-aligned against the edge than adrift in a 12rem box, and the
     rows line up into something scannable instead of a stack of paragraphs. */
  .field {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: .2rem 1rem; padding: .8rem 0;
    border-bottom: 1px solid var(--line);
  }
  .field:last-of-type { border-bottom: 0; }
  .field .label { font-size: .95rem; }
  .field .hint { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; }
  .field .error { grid-column: 1 / -1; color: var(--warn); font-size: .8rem; }

  form input[type=number], form input[type=text] {
    width: 7rem; padding: .45rem .6rem; font: inherit; text-align: right;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
  }

  /* A real switch rather than a checkbox. This is the one control here with
     an immediate consequence - off means the car charges the moment it is
     plugged in - so it should look like something you flipped. */
  .switch { position: relative; display: inline-block; width: 46px; height: 28px; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--line); transition: background .15s; pointer-events: none;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--panel); transition: transform .15s;
  }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .track::after { transform: translateX(18px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The long explanations that used to sit under every field. Kept, because
     "usually has no effect" is worth knowing, but folded away: on a phone they
     were four fifths of the page and you scrolled past them every time. */
  details.about { margin-top: 1.25rem; }
  details.about summary { cursor: pointer; color: var(--muted); font-size: .85rem; padding: .4rem 0; }
  details.about p { color: var(--muted); font-size: .85rem; margin: .5rem 0; }
  button {
    font: inherit; padding: .45rem 1.1rem; border-radius: 5px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--panel);
    cursor: pointer;
  }

  /* --- Phone -------------------------------------------------------------
     The layout was already responsive; what it was not was reachable. Links
     in a top bar are the furthest point from a thumb on a 6" screen, and the
     desktop spacing wastes a third of the viewport before the first number.
     Below this width the nav moves to the bottom as tabs and the padding
     tightens. 560px rather than a device size: it is where the four headline
     figures stop fitting two-up. */
  @media (max-width: 560px) {
    header { padding: .85rem 1rem; }
    main { padding: 1rem; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    h2 { margin: 1.5rem 0 .6rem; }
    .panel { padding: .9rem 1rem; border-radius: 10px; }

    /* Two up rather than a wrapping flex row, so the figures line up in a
       grid instead of drifting by label length. */
    .figures { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .figure .value { font-size: 1.35rem; }
    .figure .value.big { font-size: 1.9rem; }
    /* The savings headline gets the full width; it is the one number anyone
       opens this to see. */
    .figures .figure:first-child:has(.big) { grid-column: 1 / -1; }

    /* Fixed 300px overflowed a 360px-wide phone once the panel had padding. */
    .strip { width: 100%; max-width: 100%; }

    nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      gap: 0;
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav a {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: .15rem;
      /* 56px, comfortably past the 44px minimum touch target. */
      min-height: 56px;
      font-size: .7rem;
      /* Stops the grey flash on tap reading as a broken link. */
      -webkit-tap-highlight-color: transparent;
    }
    nav a.on { color: var(--accent); }
    nav svg { display: block; width: 22px; height: 22px; fill: none;
              stroke: currentColor; stroke-width: 1.8;
              stroke-linecap: round; stroke-linejoin: round; }

    form input[type=number], form input[type=text] {
      /* 16px is a hard floor: below it iOS Safari zooms the whole page in when
         the field takes focus, and does not zoom back out afterwards. */
      font-size: 16px;
      width: 6.5rem;
      padding: .55rem .6rem;
    }
    .field { padding: .9rem 0; }
    /* Full width, because a Save the width of the word "Save" is a small
       target at the bottom of a form you just finished thumbing through. */
    button[type=submit] { width: 100%; padding: .8rem; font-size: 1rem; margin-top: .5rem; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="{{ url_for('overview') }}">EV Smart Charge</a></h1>
  <!-- Inline SVG rather than an icon font or a sprite, for the same reason the
       charts are hand-built: three glyphs do not justify a dependency on a LAN
       application that has to work when the internet does not. Hidden entirely
       above the phone breakpoint, where the labels do the work. -->
  <nav>
    <a href="{{ url_for('overview') }}" {% if page == 'overview' %}class="on"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Overview
    </a>
    <a href="{{ url_for('history') }}" {% if page == 'history' %}class="on"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      History
    </a>
    <a href="{{ url_for('settings_page') }}" {% if page == 'settings' %}class="on"{% endif %}>
      <!-- Sliders rather than a cog: at 22px a cog's teeth collapse into a
           circle with spikes, which reads as a brightness icon. -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Settings
    </a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
