<!doctype html>
<html lang="en">
{% from "macros.html" import icon %}
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page paint under the iPhone home indicator, and
     the bottom tab bar below pads itself back out with env(safe-area-inset-*).
     Without it a standalone launch leaves a white band under the bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}EV Smart Charge{% endblock %}</title>

<!-- Added to the home screen this launches without browser chrome, which is the
     whole of what "app feel" turned out to need. -->
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<!-- iOS ignores the manifest and wants its own three. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EV Charge">
<!-- Two, so the status bar follows the page into dark mode. -->
<meta name="theme-color" content="#eef2f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1714" media="(prefers-color-scheme: dark)">
<!-- Schibsted Grotesk carries the figures, which are most of what these screens
     are. If it fails to load the fallbacks have close enough metrics that
     nothing reflows badly. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
  /* Tokens are defined on :root and only redefined for dark, so no colour has
     its single definition inside a media query. Dark is its own palette - a
     spruce night rather than the light one inverted. */
  :root {
    --bg: #eef2f0;
    --surface: #fbfcfb;
    --ink: #10302a;
    --muted: #5d6f69;
    --rule: #c6d3cd;
    --track: #d6e0db;
    --accent: #2f6f4f;
    --stripe: #c4e0d0;
    --thumb: #ffffff;
    --error: #a3261d;
    --error-bg: #f6dcd8;
    --warn: #6e4a00;
    --warn-bg: #f3e4bf;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1714;
      --surface: #15211d;
      --ink: #e3ebe7;
      --muted: #93a59e;
      --rule: #2a3934;
      --track: #22302b;
      --accent: #74c69b;
      --stripe: #24402f;
      --thumb: #e3ebe7;
      --error: #f2b8b0;
      --error-bg: #4a1d18;
      --warn: #eac46e;
      --warn-bg: #3d3113;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.45 "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  }
  /* No tabular-nums anywhere: in this face they widen the full stop and colon
     too, so "213.25 kr" reads as "213 . 25 kr". Amounts are right-aligned,
     which lines them up well enough without. */
  a { color: var(--accent); font-weight: 600; }
  a:focus-visible, button:focus-visible, summary:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }

  /* The status bar is translucent in standalone mode, so the top inset is the
     page's to pad. The bottom leaves room for the fixed tab bar. */
  main {
    display: grid; gap: 36px;
    max-width: 560px; margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom));
  }
  section { min-width: 0; }

  .i {
    width: 22px; height: 22px; flex-shrink: 0;
    fill: none; stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round;
  }

  .head { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 44px; }
  .head > a { display: inline-flex; align-items: center; min-height: 44px; text-decoration: none; }
  .title { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 700; letter-spacing: -0.01em; }
  .brand { font-size: 17px; font-weight: 700; letter-spacing: -0.01em; }
  .muted { margin: 0; color: var(--muted); font-size: 14px; }
  .detail { color: var(--muted); font-size: 13px; }
  .empty { margin: 0; color: var(--muted); font-size: 15px; }

  .pill {
    display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px;
    border: 1px solid var(--rule); border-radius: 999px;
    font-size: 13px; font-weight: 500; white-space: nowrap;
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); }
  .pill .i { width: 16px; height: 16px; }
  .pill.warn { background: var(--warn-bg); color: var(--warn); border-color: transparent; }

  .banner, .notice {
    display: flex; align-items: flex-start; gap: 10px;
    margin: 14px 0 0; padding: 12px 14px; border-radius: 10px; font-size: 14px;
  }
  .banner { background: var(--error-bg); color: var(--error); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }
  .notice { margin: 8px 0 0; background: var(--surface); border: 1px solid var(--rule); }
  .banner .i, .notice .i { width: 18px; height: 18px; margin-top: 1px; }

  /* 7 / 30 / 90, as underlined tabs. Each is a full 44px target. */
  .period { display: flex; gap: 2px; }
  .period a {
    display: grid; place-items: center; min-width: 44px; height: 44px;
    color: var(--muted); font-size: 15px; font-weight: 600; text-decoration: none;
    -webkit-tap-highlight-color: transparent;
  }
  .period a.on { color: var(--ink); box-shadow: inset 0 -3px 0 var(--ink); }

  /* --- The battery ------------------------------------------------------- */

  .soc-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  .soc { font-size: 108px; line-height: .82; font-weight: 800; letter-spacing: -0.05em; }
  .target { display: flex; flex-direction: column; align-items: flex-end; padding-bottom: 4px; }
  .target span { color: var(--muted); font-size: 13px; }
  .target strong { font-size: 28px; line-height: 1; font-weight: 700; }

  .battery { display: flex; align-items: center; gap: 3px; margin-top: 14px; }
  .battery .cell { position: relative; flex-grow: 1; height: 60px; border: 3px solid var(--ink); border-radius: 14px; }
  .battery .inner { position: absolute; inset: 5px; }
  .battery .nub { width: 7px; height: 22px; border-radius: 0 4px 4px 0; background: var(--ink); }
  .level, .to-go { position: absolute; top: 0; bottom: 0; border-radius: 7px; }
  .level { left: 0; background: var(--ink); }
  /* What tonight's charge still has to add. */
  .to-go { margin-left: 3px; background: repeating-linear-gradient(135deg, var(--accent) 0 3px, var(--stripe) 3px 9px); }

  .status { display: flex; align-items: flex-start; gap: 10px; margin-top: 14px; }
  .status .i { margin-top: 2px; }
  .status strong { display: block; font-size: 18px; line-height: 1.3; font-weight: 600; }
  .status.is-error { color: var(--error); }

  /* --- Savings, as a receipt --------------------------------------------- */

  .ledger { margin: 14px 0 0; }
  .ledger div {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
    padding: 10px 0; border-top: 1px solid var(--rule);
  }
  .ledger dd { margin: 0; white-space: nowrap; }
  .ledger .baseline { color: var(--muted); }
  .ledger .total { padding: 12px 0 0; border-top: 3px double var(--ink); }
  .ledger .total dt { font-size: 18px; font-weight: 700; }
  .ledger .total dd { font-size: 38px; line-height: 1; font-weight: 800; letter-spacing: -0.02em; color: var(--accent); }

  .chart { margin-top: 16px; }
  .chart svg { display: block; width: 100%; height: 72px; }
  .chart .bar { fill: var(--accent); }
  .chart .axis { stroke: var(--ink); }
  .chart .ticks { display: flex; justify-content: space-between; margin-top: 4px; color: var(--muted); font-size: 12px; }

  .about { margin-top: 8px; }
  .about summary {
    display: inline-flex; align-items: center; gap: 6px; min-height: 44px;
    color: var(--accent); font-size: 15px; font-weight: 600; cursor: pointer; list-style: none;
  }
  .about summary::-webkit-details-marker { display: none; }
  .about summary .i { width: 18px; height: 18px; }
  .about p { margin: 0 0 10px; max-width: 65ch; color: var(--muted); font-size: 14px; }

  /* --- Sessions ---------------------------------------------------------- */

  .list { list-style: none; margin: 0; padding: 0; }
  .list > li {
    display: flex; justify-content: space-between; align-items: center; gap: 16px;
    padding: 14px 0; border-top: 1px solid var(--rule);
  }
  .list > li.session { display: block; }
  .session-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .when { font-size: 15px; font-weight: 600; }
  .saved { display: flex; flex-direction: column; align-items: flex-end; white-space: nowrap; }
  .saved strong { font-size: 18px; font-weight: 700; }
  .saved span { color: var(--muted); font-size: 12px; }

  .mini { position: relative; width: 140px; height: 8px; margin: 6px 0; border-radius: 4px; background: var(--track); overflow: hidden; }
  .mini span { position: absolute; top: 0; bottom: 0; }
  .mini .had { left: 0; background: var(--ink); }
  .mini .added { background: var(--accent); opacity: .6; }

  .strip { display: block; width: 100%; height: 44px; margin-top: 10px; }
  .strip .slot { fill: var(--rule); }
  .strip .slot.charged { fill: var(--accent); }

  /* The runs log: time, what it decided, battery. A heading per day, so the
     date is not repeated on every row. */
  .runs { list-style: none; margin: 0; padding: 0; }
  .runs li {
    display: grid; grid-template-columns: 3rem 36px 1fr auto; align-items: center; gap: 12px;
    padding: 10px 0; border-top: 1px solid var(--rule);
  }
  .runs li.day { display: block; padding: 20px 0 6px; border-top: 0; font-size: 14px; font-weight: 700; }
  .runs li.day + li { border-top: 0; }
  .runs .time { color: var(--muted); }
  .runs .what { font-size: 15px; font-weight: 600; }
  .runs .detail.is-error { color: var(--error); }
  .runs .pct { white-space: nowrap; }
  .badge {
    display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--rule);
  }
  .badge .i { width: 20px; height: 20px; }
  .badge.is-error { background: var(--error-bg); color: var(--error); border-color: transparent; }

  /* --- Settings ---------------------------------------------------------- */

  /* A settings row: name on the left, value on the right, one line of hint
     under both. Every value here is short - 7, 11.0, 82, 80 - so they read
     better right-aligned against the edge than adrift in a wide box. */
  .field {
    display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 16px;
    padding: 14px 0; border-bottom: 1px solid var(--rule);
  }
  .field .label { font-weight: 600; }
  .field .hint { grid-column: 1 / -1; color: var(--muted); font-size: 13px; }
  .field .error { grid-column: 1 / -1; color: var(--error); font-size: 13px; font-weight: 500; }

  input[type=number] {
    /* 16px is a hard floor: below it iOS Safari zooms the whole page in when
       the field takes focus, and does not zoom back out afterwards. */
    width: 6.5rem; height: 44px; padding: 0 12px;
    font: inherit; font-size: 16px; font-weight: 600; text-align: right;
    background: var(--surface); color: var(--ink);
    border: 1px solid var(--rule); border-radius: 10px;
  }
  input[type=number]:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }

  /* A real switch rather than a checkbox. This is the one control here with
     an immediate consequence - off means the car charges the moment it is
     plugged in - so it should look like something you flipped. */
  .switch { position: relative; display: inline-block; width: 52px; height: 32px; }
  .switch input { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; opacity: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--track); transition: background .15s; pointer-events: none;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px;
    border-radius: 50%; background: var(--thumb); box-shadow: 0 1px 2px rgba(16, 48, 42, .3);
    transition: transform .15s;
  }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .track::after { transform: translateX(20px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Full width, because a Save the width of the word "Save" is a small target
     at the bottom of a form you just finished thumbing through. */
  button.primary {
    width: 100%; height: 52px; margin-top: 20px;
    font: inherit; font-size: 16px; font-weight: 700;
    color: var(--bg); background: var(--ink); border: 0; border-radius: 12px; cursor: pointer;
  }

  /* --- Tab bar ------------------------------------------------------------
     At the bottom, where a thumb reaches on a 6" screen. */
  nav.tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    background: var(--surface); border-top: 1px solid var(--rule);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav.tabs a {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    min-height: 64px; color: var(--muted); font-size: 12px; font-weight: 500; text-decoration: none;
    /* Stops the grey flash on tap reading as a broken link. */
    -webkit-tap-highlight-color: transparent;
  }
  nav.tabs a.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 3px 0 var(--ink); }
  /* The sliders' knobs cover the lines they sit on. */
  nav.tabs .knob { fill: var(--surface); }

  @media (prefers-reduced-motion: reduce) {
    .switch .track, .switch .track::after { transition: none; }
  }
</style>
</head>
<body>
<main>{% block content %}{% endblock %}</main>
<nav class="tabs">
  <a href="{{ url_for('overview') }}" {% if page == 'overview' %}class="on" aria-current="page"{% endif %}>{{ icon('home') }}Overview</a>
  <a href="{{ url_for('history') }}" {% if page == 'history' %}class="on" aria-current="page"{% endif %}>{{ icon('history') }}History</a>
  <a href="{{ url_for('settings_page') }}" {% if page == 'settings' %}class="on" aria-current="page"{% endif %}>{{ icon('tune') }}Settings</a>
</nav>
</body>
</html>
