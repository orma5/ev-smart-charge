<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets the page paint under the iPhone home indicator, and
     the bottom tab bar below pads itself back out with env(safe-area-inset-*).
     Without it a standalone launch leaves a white band under the bar. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}EV Smart Charge{% endblock %}</title>

<!-- Added to the home screen this launches without browser chrome, which is the
     whole of what "app feel" turned out to need: the layout was already
     responsive and dark-mode aware. -->
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<link rel="icon" href="{{ url_for('static', filename='icon-192.png') }}">
<!-- iOS ignores the manifest and wants its own three. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EV Charge">
<!-- Two, so the status bar follows the page into dark mode rather than staying
     the light accent against a dark screen. -->
<meta name="theme-color" content="#2f6f4f" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
<!-- Only the glyphs the pages use, which Google Fonts requires in alphabetical
     order. An icon missing from the list renders as its name in plain text. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=battery_5_bar,battery_full,bolt,chevron_right,electric_car,electric_meter,error,ev_station,flag,help,history,hourglass_top,info,money_off,pause_circle,payments,power_off,savings,timer,update,warning,wrong_location&display=block">
<style>
  /* Tokens are defined on :root and only redefined for dark, so no colour has
     its single definition inside a media query. */
  :root {
    --bg: #f7f7f5;
    --panel: #ffffff;
    --ink: #1c1c1a;
    --muted: #6b6b66;
    --line: #e2e2dd;
    --accent: #2f6f4f;
    --accent-soft: #cfe3d7;
    --warn: #9a4a2f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16171a;
      --panel: #1e2024;
      --ink: #e8e8e4;
      --muted: #9a9a94;
      --line: #2e3136;
      --accent: #6cc08c;
      --accent-soft: #2c4436;
      --warn: #e0906f;
    }
  }

  /* Material 3 tokens, a green scheme seeded from the old accent. Overview and
     history are built on these; settings still uses the tokens above. */
  :root {
    --md-primary: #2d6a4f;
    --md-primary-container: #b1f1ce;
    --md-on-primary-container: #002113;
    --md-secondary-container: #d0e8d8;
    --md-on-secondary-container: #0b1f15;
    --md-surface: #f6fbf5;
    --md-surface-container-low: #edf3ec;
    --md-on-surface: #171d19;
    --md-on-surface-variant: #404943;
    --md-outline: #707971;
    --md-outline-variant: #c0c9c1;
    --md-error: #ba1a1a;
    --md-error-container: #ffdad6;
    --md-on-error-container: #410002;
    --md-warn-container: #ffdea5;
    --md-on-warn-container: #261900;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --md-primary: #95d5b3;
      --md-primary-container: #0f5238;
      --md-on-primary-container: #b1f1ce;
      --md-secondary-container: #354b3f;
      --md-on-secondary-container: #d0e8d8;
      --md-surface: #0f1511;
      --md-surface-container-low: #1b211d;
      --md-on-surface: #dfe4dd;
      --md-on-surface-variant: #c0c9c1;
      --md-outline: #8a938b;
      --md-outline-variant: #404943;
      --md-error: #ffb4ab;
      --md-error-container: #93000a;
      --md-on-error-container: #ffdad6;
      --md-warn-container: #5e4200;
      --md-on-warn-container: #ffdea5;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--md-surface);
    color: var(--md-on-surface);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  a { color: var(--accent); }

  header {
    display: flex; flex-wrap: wrap; gap: 1rem 2rem; align-items: baseline;
    padding: 1rem 1.5rem;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { font-size: 1rem; margin: 0; letter-spacing: .02em; }
  header h1 a { color: var(--ink); text-decoration: none; }
  nav { display: flex; gap: 1.25rem; }
  nav a { text-decoration: none; color: var(--muted); }
  nav a:hover, nav a.on { color: var(--ink); }
  /* Desktop reads the labels; the icons are for the bottom bar below. */
  nav svg { display: none; }

  main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
  h2 { font-size: 1rem; margin: 2rem 0 .75rem; }
  h2:first-child { margin-top: 0; }

  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 1rem 1.25rem;
    margin-bottom: 1rem;
  }

  .note { color: var(--muted); font-size: .82rem; margin: .5rem 0 0; }

  /* --- Material 3 --------------------------------------------------------- */

  .ms {
    font-family: "Material Symbols Rounded";
    font-weight: normal; font-style: normal; font-size: 20px; line-height: 1;
    letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr;
    font-feature-settings: "liga"; -webkit-font-smoothing: antialiased;
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 20;
    vertical-align: middle;
  }

  .md { display: grid; gap: 12px; }
  .md-card { background: var(--md-surface-container-low); border-radius: 16px; padding: 16px; }
  .md-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  .md h2 { margin: 0; display: flex; color: var(--md-on-surface-variant); }
  .md h2 .ms { font-size: 24px; }

  /* The decision, as one large icon. */
  .md-hero {
    display: grid; place-items: center; width: 96px; height: 96px; margin: 0 auto 16px;
    border-radius: 28px;
    background: var(--md-primary-container); color: var(--md-on-primary-container);
  }
  .md-hero .ms { font-size: 56px; font-variation-settings: "FILL" 1, "wght" 400, "GRAD" 0, "opsz" 48; }
  .md-hero.is-error { background: var(--md-error-container); color: var(--md-on-error-container); }

  .md-chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .md-chips.start { justify-content: flex-start; }
  .md-chip {
    display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px 0 8px;
    border: 1px solid var(--md-outline-variant); border-radius: 8px;
    color: var(--md-on-surface-variant); font-size: .875rem; font-weight: 500;
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .md-chip .ms { font-size: 18px; }
  .md-chip s { font-weight: 400; opacity: .7; }
  .md-chip.warn { background: var(--md-warn-container); color: var(--md-on-warn-container); border-color: transparent; padding: 0 8px; }

  .md-banner {
    display: flex; align-items: flex-start; gap: 8px; margin-top: 12px; padding: 12px;
    border-radius: 12px; font-size: .875rem;
    background: var(--md-error-container); color: var(--md-on-error-container);
  }
  .md-banner.warn { background: var(--md-warn-container); color: var(--md-on-warn-container); }
  .md-empty { margin: 0; color: var(--md-on-surface-variant); font-size: .875rem; }

  .md-seg { display: flex; border: 1px solid var(--md-outline); border-radius: 999px; overflow: hidden; }
  .md-seg a {
    display: grid; place-items: center; min-width: 48px; height: 40px; padding: 0 12px;
    color: var(--md-on-surface); text-decoration: none; font-size: .875rem; font-weight: 500;
    -webkit-tap-highlight-color: transparent;
  }
  .md-seg a + a { border-left: 1px solid var(--md-outline); }
  .md-seg a.on { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }

  .md-display {
    margin: 0 0 12px; font-size: 2.75rem; line-height: 1.15;
    color: var(--md-primary); font-variant-numeric: tabular-nums;
  }

  .chart svg { display: block; width: 100%; height: 120px; margin-top: 1rem; }
  .chart .bar { fill: var(--md-primary); }
  .chart .axis { stroke: var(--md-outline-variant); }
  .chart .ticks { display: flex; justify-content: space-between; color: var(--md-on-surface-variant); font-size: .75rem; }

  .strip { display: block; width: 100%; height: 44px; margin-top: 12px; }
  .strip .slot { fill: var(--md-outline-variant); }
  .strip .slot.charged { fill: var(--md-primary); }

  .md-about summary {
    display: grid; place-items: center; width: 40px; height: 40px; margin: 4px -8px 0 auto;
    border-radius: 50%; list-style: none; cursor: pointer; color: var(--md-on-surface-variant);
  }
  .md-about summary::-webkit-details-marker { display: none; }
  .md-about[open] summary { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }
  .md-about p { margin: 4px 0 0; color: var(--md-on-surface-variant); font-size: .875rem; }

  .md-icon-btn {
    display: grid; place-items: center; width: 40px; height: 40px; margin-right: -8px;
    border-radius: 50%; color: var(--md-primary); text-decoration: none;
  }
  .md-icon-btn .ms { font-size: 24px; }

  /* Lists rather than tables: on a phone the tables wrapped every date onto
     three lines and still scrolled sideways. */
  .md-list { list-style: none; margin: 0; padding: 0; }
  .md-list li {
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
    padding: 12px 0; border-top: 1px solid var(--md-outline-variant);
  }
  .md-list li:first-child { border-top: 0; padding-top: 4px; }
  .md-when { font-weight: 500; }
  .md-meta {
    display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 2px;
    color: var(--md-on-surface-variant); font-size: .8125rem; font-variant-numeric: tabular-nums;
  }
  .md-meta span, .md-end { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .md-meta .ms { font-size: 16px; }
  .md-meta.is-error { color: var(--md-error); }
  .md-end { color: var(--md-primary); font-weight: 500; font-variant-numeric: tabular-nums; }
  .md-end .ms { font-size: 18px; }
  .md-end.lg { font-size: 1.375rem; }
  .md-end.lg .ms { font-size: 24px; }

  /* The runs log: time, what it decided, battery. A heading per day, so the
     date is not repeated on every row. */
  .md-runs li { display: grid; grid-template-columns: 3rem 36px 1fr auto; }
  .md-runs .time, .md-runs .pct { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .md-runs .time { color: var(--md-on-surface-variant); }
  .md-runs .md-day {
    display: block; padding: 16px 0 4px; border-top: 0;
    color: var(--md-on-surface-variant); font-size: .75rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .md-runs .md-day + li { border-top: 0; }
  .md-badge {
    display: grid; place-items: center; width: 36px; height: 36px; border-radius: 12px;
    background: var(--md-secondary-container); color: var(--md-on-secondary-container);
  }
  .md-badge.is-error { background: var(--md-error-container); color: var(--md-on-error-container); }

  /* A settings row: name on the left, value on the right, one line of hint
     under both. Every value here is short - 7, 11.0, 82, 80 - so they read
     better right-aligned against the edge than adrift in a 12rem box, and the
     rows line up into something scannable instead of a stack of paragraphs. */
  .field {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: .2rem 1rem; padding: .8rem 0;
    border-bottom: 1px solid var(--line);
  }
  .field:last-of-type { border-bottom: 0; }
  .field .label { font-size: .95rem; }
  .field .hint { grid-column: 1 / -1; color: var(--muted); font-size: .8rem; }
  .field .error { grid-column: 1 / -1; color: var(--warn); font-size: .8rem; }

  form input[type=number], form input[type=text] {
    width: 7rem; padding: .45rem .6rem; font: inherit; text-align: right;
    background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
  }

  /* A real switch rather than a checkbox. This is the one control here with
     an immediate consequence - off means the car charges the moment it is
     plugged in - so it should look like something you flipped. */
  .switch { position: relative; display: inline-block; width: 46px; height: 28px; }
  .switch input { position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
  .switch .track {
    position: absolute; inset: 0; border-radius: 999px;
    background: var(--line); transition: background .15s; pointer-events: none;
  }
  .switch .track::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px;
    border-radius: 50%; background: var(--panel); transition: transform .15s;
  }
  .switch input:checked ~ .track { background: var(--accent); }
  .switch input:checked ~ .track::after { transform: translateX(18px); }
  .switch input:focus-visible ~ .track { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The long explanations that used to sit under every field. Kept, because
     "usually has no effect" is worth knowing, but folded away: on a phone they
     were four fifths of the page and you scrolled past them every time. */
  details.about { margin-top: 1.25rem; }
  details.about summary { cursor: pointer; color: var(--muted); font-size: .85rem; padding: .4rem 0; }
  details.about p { color: var(--muted); font-size: .85rem; margin: .5rem 0; }
  button {
    font: inherit; padding: .45rem 1.1rem; border-radius: 5px;
    border: 1px solid var(--accent); background: var(--accent); color: var(--panel);
    cursor: pointer;
  }

  /* --- Phone -------------------------------------------------------------
     The layout was already responsive; what it was not was reachable. Links
     in a top bar are the furthest point from a thumb on a 6" screen, and the
     desktop spacing wastes a third of the viewport before the first number.
     Below this width the nav moves to the bottom as tabs and the padding
     tightens. 560px rather than a device size. */
  @media (max-width: 560px) {
    header { padding: .85rem 1rem; }
    main { padding: 1rem; padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
    h2 { margin: 1.5rem 0 .6rem; }
    .panel { padding: .9rem 1rem; border-radius: 10px; }
    .md-display { font-size: 2.25rem; }

    nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
      gap: 0;
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }
    nav a {
      flex: 1;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: .15rem;
      /* 56px, comfortably past the 44px minimum touch target. */
      min-height: 56px;
      font-size: .7rem;
      /* Stops the grey flash on tap reading as a broken link. */
      -webkit-tap-highlight-color: transparent;
    }
    nav a.on { color: var(--accent); }
    nav svg { display: block; width: 22px; height: 22px; fill: none;
              stroke: currentColor; stroke-width: 1.8;
              stroke-linecap: round; stroke-linejoin: round; }

    form input[type=number], form input[type=text] {
      /* 16px is a hard floor: below it iOS Safari zooms the whole page in when
         the field takes focus, and does not zoom back out afterwards. */
      font-size: 16px;
      width: 6.5rem;
      padding: .55rem .6rem;
    }
    .field { padding: .9rem 0; }
    /* Full width, because a Save the width of the word "Save" is a small
       target at the bottom of a form you just finished thumbing through. */
    button[type=submit] { width: 100%; padding: .8rem; font-size: 1rem; margin-top: .5rem; }
  }
</style>
</head>
<body>
<header>
  <h1><a href="{{ url_for('overview') }}">EV Smart Charge</a></h1>
  <!-- Hidden entirely above the phone breakpoint, where the labels do the work. -->
  <nav>
    <a href="{{ url_for('overview') }}" {% if page == 'overview' %}class="on"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      Overview
    </a>
    <a href="{{ url_for('history') }}" {% if page == 'history' %}class="on"{% endif %}>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      History
    </a>
    <a href="{{ url_for('settings_page') }}" {% if page == 'settings' %}class="on"{% endif %}>
      <!-- Sliders rather than a cog: at 22px a cog's teeth collapse into a
           circle with spikes, which reads as a brightness icon. -->
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="17" r="2"/></svg>
      Settings
    </a>
  </nav>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
